<style>
/* Layout: full-bleed WebGL scene; a small dark HUD card top-left and a help strip bottom-left. Single dark look (matches the in-headset panels). */
:root {
  --ink: #0F172A;        /* panel */
  --ink-2: #1E293B;      /* surface */
  --line: #334155;       /* border */
  --text: #F8FAFC;
  --text-2: #CBD5E1;
  --text-3: #94A3B8;
  --teal: #1E7C7B;       /* primary */
  --teal-2: #2CA8A4;     /* accent */
  --focus: #94F4EE;
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: #DDE5EC; color: var(--text); font-family: var(--font); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hud {
  position: fixed; z-index: 5;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  max-width: min(420px, calc(100vw - 32px));
  background: color-mix(in srgb, var(--ink) 94%, transparent);
  border: 1px solid rgb(255 255 255 / 0.12); border-radius: 18px;
  padding: 14px 16px; display: grid; gap: 10px;
  box-shadow: 0 10px 30px rgb(2 6 23 / 0.25);
}
.hud h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; }
.hud-head { display: flex; align-items: center; gap: 12px; }
.hud-title { display: grid; gap: 2px; min-width: 0; flex: 1; }
.hud-sub { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-toggle {
  flex: none; width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; cursor: pointer;
  background: var(--ink-2); border: 1px solid var(--line); color: var(--text-2); padding: 0;
}
.hud-toggle:hover { border-color: var(--teal-2); color: var(--text); }
.hud-toggle:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.hud-toggle svg { transition: transform 0.2s ease; }
.hud[data-collapsed="true"] .hud-toggle svg { transform: rotate(-90deg); }
.hud-body { display: grid; gap: 10px; }
.hud[data-collapsed="true"] { padding-block: 10px; }
.hud[data-collapsed="true"] .hud-body { display: none; }
.hud p { margin: 0; font-size: 13px; color: var(--text-3); line-height: 1.45; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  font: 600 13px/1 var(--font); color: var(--text); cursor: pointer;
  background: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px;
}
.btn:hover { border-color: var(--teal-2); }
.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--teal); border-color: var(--teal-2); }
.help {
  position: fixed; z-index: 5;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px; pointer-events: none;
}
.chip {
  font-size: 12px; color: var(--text-2); background: color-mix(in srgb, var(--ink) 88%, transparent);
  border: 1px solid rgb(255 255 255 / 0.1); border-radius: 999px; padding: 6px 12px;
}
.chip b { color: var(--text); font-weight: 600; }
#vr-slot button { position: static !important; transform: none !important; left: auto !important; bottom: auto !important;
  font: 600 13px/1 var(--font) !important; padding: 9px 14px !important; border-radius: 999px !important;
  border: 1px solid var(--teal-2) !important; background: var(--teal) !important; color: var(--text) !important; opacity: 1 !important; width: auto !important; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 4; color: #334155; font: 500 15px var(--font); }
@media (max-width: 520px) { .hud p.long { display: none; } }
@media (prefers-reduced-motion: reduce) { .btn, .hud-toggle svg { transition: none; } }
</style>

<script>
// Collapsible controls card: remembers the viewer's choice; starts folded on phone-width screens.
(() => {
  const hud = document.getElementById('hud'), btn = document.getElementById('hud-toggle');
  const set = collapsed => {
    hud.dataset.collapsed = String(collapsed);
    btn.setAttribute('aria-expanded', String(!collapsed));
    const label = collapsed ? 'Expand controls' : 'Collapse controls';
    btn.setAttribute('aria-label', label); btn.title = label;
  };
  let saved = null;
  try { saved = localStorage.getItem('nc-xr-hud-collapsed'); } catch (_) {}
  set(saved === null ? matchMedia('(max-width: 520px)').matches : saved === 'true');
  btn.addEventListener('click', () => {
    const next = hud.dataset.collapsed !== 'true'; set(next);
    try { localStorage.setItem('nc-xr-hud-collapsed', String(next)); } catch (_) {}
  });
})();
</script>

<script type="module">

// ------------------------------------------------------------------ tokens (from the Figma UI kit)
const C = {

// ------------------------------------------------------------------ flow 3 data (DT_Flow3Steps + ST_Flow3)
const PHASES = ['Prepare', 'Remove old', 'Fit new', 'Close down'];
const SHORT = ['Go to zone', 'Sanitize hands', 'Open doors', 'Sanitize again', 'Undock needle', 'Unlock and remove', 'Sanitize hands', 'Pick sterile needle', 'Dock needle', 'Lock screw', 'Return cover', 'Sanitize hands', 'Close doors'];

const ROWS = [

  { n: 2, ph: 0, c: 'Sanitize', t: 'Sanitizer', show: 1, i: 'Sanitize your hands before you continue.', d: 'Rub every surface of both hands until they’re dry.', h: SAN_HINT, nu: SAN_NUDGE, done: 'Hands sanitized', why: 'Hands carry most contamination into a clean area. Rub until dry.' },

  { n: 7, ph: 2, c: 'Sanitize', t: 'Sanitizer', show: 1, i: 'Sanitize your hands before you handle the new needle.', h: SAN_HINT, nu: SAN_NUDGE, done: 'Hands sanitized', why: 'Your hands touched the used needle. Sanitize before touching anything sterile.' },
  { n: 8, ph: 2, c: 'PickItem', t: 'SterileNeedle', i: 'Take the sterile needle from the packet on the far right.', h: 'Reach in and squeeze grip to pick up', done: 'Sterile needle picked', e: 'That item isn’t sterile.', ed: 'Put it back and take the needle from the packet on the far right.', why: 'Only the far-right packet holds the sterile needle.' },

  { n: 11, ph: 3, c: 'MoveComponent', t: 'NeedleCover', i: 'Move the hydraulic cover back into place.', d: 'This protects the new needle from contamination.', h: 'Grip the cover and move it back up', done: 'Cover back in place', why: 'The cover protects the new needle until the line restarts.' },
  { n: 12, ph: 3, c: 'Sanitize', t: 'Sanitizer', show: 1, i: 'Sanitize your hands before you leave this area.', h: SAN_HINT, nu: SAN_NUDGE, done: 'Hands sanitized', why: 'Sanitize before you leave so you don’t carry residue out of the area.' },

const TAG_LABEL = { FloorZone: 'Stand here', Sanitizer: 'Sanitizer', DoorHandles: 'Handle', HMIStart: 'Start button', NeedleCover: 'Needle cover', NeedleBase: 'Needle base', Tray: 'Tray', SterileNeedle: 'Sterile needle', DockingStation: 'Docking station', LockScrew: 'Locking screw' };
const IDLE_SECONDS = 20; // 60 s in the real build; shortened for the prototype

// ------------------------------------------------------------------ flow 1 data (Figma gowning screens + copy deck)
// Donning order follows the redesign; confirm it against the site SOP.
const GOWN = [
  { key: 'hair', name: 'Hair cover', why: 'Keeps hair and skin flakes out of the clean area.', when: 'The hair cover goes on first, before anything touches your face or gown.' },
  { key: 'mask', name: 'Face mask', why: 'Stops breath and droplets from reaching the product.', when: 'The face mask goes on right after the hair cover.' },
  { key: 'gown', name: 'Gown or coverall', why: 'Stops particles shed from your body and clothes from entering the area.', when: 'The gown goes on once your hair and face are covered.' },
  { key: 'shoes', name: 'Shoe covers', why: 'Keeps dirt and particles from the floor out of the clean area.', when: 'Shoe covers go on after the gown.' },
  { key: 'eyes', name: 'Eye protection', why: 'Contains particles from your face and protects your eyes from splashes.', when: 'Eye protection goes on after the shoe covers.' },
  { key: 'gloves', name: 'Sterile gloves', why: 'Protect the product from contaminants on your hands. Put them on last to keep them sterile.', when: 'Sterile gloves go on last, so they stay sterile.' },
];
const BENCH_ORDER = ['gloves', 'gown', 'hair', 'eyes', 'shoes', 'mask']; // shuffled on the bench
const ORD = ['first', 'second', 'third', 'fourth', 'fifth', 'last'];

// ------------------------------------------------------------------ renderer + scene
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.xr.enabled = true;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#DCE4EB');
scene.fog = new THREE.Fog('#DCE4EB', 7, 16);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.02, 50);
const rig = new THREE.Group(); // moves the VR player; desktop camera stays outside it
scene.add(rig);
const START_CAM = new THREE.Vector3(0, 1.62, 3.1), START_LOOK = new THREE.Vector3(0, 1.3, -1.2);
// desktop camera stands back a little so the side panels stay in view; in VR the player stands in the ring itself
const STAND_CAM = new THREE.Vector3(0, 1.62, 1.45), STAND_LOOK = new THREE.Vector3(0, 1.2, -1.6);
const VR_STAND_Z = 0.45;
// flow 1 happens in the gowning area on the left, facing the bench (looking toward -x)
const GOWN_CAM = new THREE.Vector3(-1.15, 1.62, 1.6), GOWN_LOOK = new THREE.Vector3(-3.4, 1.15, 1.6);
const BENCH_CENTER = new THREE.Vector3(-3.4, 1.0, 1.6);
camera.position.copy(START_CAM);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(START_LOOK);
controls.enableDamping = true;
controls.minDistance = 0.6; controls.maxDistance = 4.2;
controls.minPolarAngle = 0.55; controls.maxPolarAngle = 1.75;
controls.update();

scene.add(new THREE.HemisphereLight('#FFFFFF', '#9FB0BF', 1.1));
const sun = new THREE.DirectionalLight('#FFFFFF', 1.4);
sun.position.set(2, 4, 3); scene.add(sun);

// ------------------------------------------------------------------ materials
const M = {
  floor: new THREE.MeshStandardMaterial({ color: '#C9D3DC', roughness: 0.55, metalness: 0.05 }),
  wall: new THREE.MeshStandardMaterial({ color: '#EEF3F6', roughness: 0.9 }),
  wallTeal: new THREE.MeshStandardMaterial({ color: '#BFE4E1', roughness: 0.9 }),
  steel: new THREE.MeshStandardMaterial({ color: '#C7CDD3', roughness: 0.32, metalness: 0.75 }),
  darkSteel: new THREE.MeshStandardMaterial({ color: '#7A848E', roughness: 0.4, metalness: 0.7 }),
  glass: new THREE.MeshStandardMaterial({ color: '#CFF3EF', roughness: 0.05, metalness: 0.0, transparent: true, opacity: 0.22, depthWrite: false }),
  frame: new THREE.MeshStandardMaterial({ color: '#E7ECEF', roughness: 0.35, metalness: 0.4 }),
  white: new THREE.MeshStandardMaterial({ color: '#F7F9FA', roughness: 0.7 }),
  packet: new THREE.MeshStandardMaterial({ color: '#E8F1FB', roughness: 0.6 }),
  packetBlue: new THREE.MeshStandardMaterial({ color: '#8FB7E8', roughness: 0.6 }),
  hmi: new THREE.MeshStandardMaterial({ color: '#2B3440', roughness: 0.5, metalness: 0.3 }),

const box = (w, h, d, m) => new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, Math.min(w, h, d) * 0.12), m);
const cyl = (r, h, m, seg = 24) => new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), m);

// interactive objects: userData.tags = [...], userData.pickable = true
const pickables = [];
function pickable(obj, tags = []) {
  obj.userData.tags = tags; obj.userData.pickable = true;
  obj.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.userData.baseEmissive = o.material.emissive ? o.material.emissive.clone() : null; } });
  pickables.push(obj); return obj;
}

// ------------------------------------------------------------------ room (sized for the Line 18 enclosure)
const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), M.floor);
floor.rotation.x = -Math.PI / 2; floor.position.z = -0.5; scene.add(floor);
const grid = new THREE.GridHelper(14, 28, '#AEBBC6', '#BFCAD3'); grid.position.set(0, 0.002, -0.5); grid.material.opacity = 0.5; grid.material.transparent = true; scene.add(grid);
const back = new THREE.Mesh(new THREE.PlaneGeometry(12.2, 3.4), M.wallTeal); back.position.set(0, 1.7, -5.8); scene.add(back);
for (const s of [-1, 1]) { const w = new THREE.Mesh(new THREE.PlaneGeometry(11, 3.4), M.wall); w.position.set(6.1 * s, 1.7, -0.3); w.rotation.y = -s * Math.PI / 2; scene.add(w); }

// ------------------------------------------------------------------ Line 18 RABS: converted from the Unity FBX models

// merged per material, simplified with meshoptimizer and meshopt-compressed (about 290k -> 95k triangles, 9.6 MB -> 1 MB).
const gltfLoader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
async function loadLine18() { // the .glb where it is served (local, headset); the same bytes as a JS module elsewhere
  try { const r = await fetch('models/line18-rabs.glb'); if (r.ok) return await gltfLoader.parseAsync(await r.arrayBuffer(), ''); } catch (_) {}
  const { default: b64 } = await import('./models/line18-rabs.glb.js');
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return gltfLoader.parseAsync(bin.buffer, '');
}
const line18 = (await loadLine18()).scene;
const part = n => line18.getObjectByName(n);

scene.add(line18);
const RABS = new THREE.Group(); scene.add(RABS);
// stainless base under the filling module (not part of the supplied FBX set)
const base = box(3.0, 0.74, 2.3, M.steel); base.position.set(0, 0.37, -2.45); RABS.add(base);
const kick = box(2.9, 0.1, 2.2, M.darkSteel); kick.position.set(0, 0.05, -2.43); RABS.add(kick);

// operator doors: the supplied SFPI doors are modelled open, so these animated doors fill the real door bay
const doors = [];
const handles = [];
const DOOR_OPEN = 1.0; // radians; wider would swing into the HMI arm
for (const s of [-1, 1]) {
  const hinge = new THREE.Group(); hinge.position.set(1.5 * s, 0.76, -1.3); RABS.add(hinge);

function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function wrap(ctx, text, maxW) {
  const out = []; for (const para of String(text).split('\n')) { let line = '';
    for (const w of para.split(' ')) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
    out.push(line); } return out;
}
class Panel {
  constructor(w, h, widthM, anchor = 'top') {

    this.ctx = this.cv.getContext('2d'); this.ctx.scale(2, 2);
    this.tex = new THREE.CanvasTexture(this.cv); this.tex.colorSpace = THREE.SRGBColorSpace; this.tex.anisotropy = 8;
    const hm = widthM * h / w; const g = new THREE.PlaneGeometry(widthM, hm);
    if (anchor === 'top') g.translate(0, -hm / 2, 0);
    this.mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: this.tex, transparent: true, toneMapped: false, depthWrite: false }));
    this.mesh.renderOrder = 10; this.mesh.userData.panel = this;
    this.hits = []; this.bg = { x: 0, y: 0, w, h }; this.hover = null; this.draw = () => {};
  }
  begin() { if (this.nested) return; this.ctx.clearRect(0, 0, this.w, this.h); this.hits = []; }
  end() { this.tex.needsUpdate = true; }
  hitAt(uv) {
    const x = uv.x * this.w, y = (1 - uv.y) * this.h, b = this.bg;
    if (x < b.x || x > b.x + b.w || y < b.y || y > b.y + b.h) return null;
    return this.hits.find(h => !h.disabled && x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) || { id: null };
  }
  surface(x, y, w, h, r, stroke = 'rgba(255,255,255,0.14)', lw = 1.5, fill = 'rgba(15,23,42,0.96)') {
    if (this.nested) return;
    const c = this.ctx; this.bg = { x, y, w, h };
    c.save(); c.shadowColor = 'rgba(2,6,23,0.35)'; c.shadowBlur = 18; c.shadowOffsetY = 6;
    rr(c, x + 1, y + 1, w - 2, h - 2, r); c.fillStyle = fill; c.fill(); c.restore();
    rr(c, x + 1, y + 1, w - 2, h - 2, r); c.strokeStyle = stroke; c.lineWidth = lw; c.stroke();
  }
  button(id, x, y, w, label, variant = 'primary', disabled = false, h = 64) {
    const c = this.ctx, hov = this.hover === id && !disabled;
    rr(c, x, y, w, h, h / 2);
    if (disabled) { c.fillStyle = C.border; c.fill(); }
    else if (variant === 'primary') { c.fillStyle = hov ? C.primaryHover : C.primary; c.fill(); }
    else { c.fillStyle = hov ? C.surface : 'rgba(0,0,0,0)'; c.fill(); c.strokeStyle = C.borderStrong; c.lineWidth = 2; c.stroke(); }
    if (hov) { rr(c, x - 3, y - 3, w + 6, h + 6, h / 2 + 3); c.strokeStyle = C.focus; c.lineWidth = 3; c.stroke(); }

}

function pickFromRay() {
  const targets = [...panels.filter(p => p.mesh.visible).map(p => p.mesh), ...pickables];
  const hits = raycaster.intersectObjects(targets, true);
  for (const h of hits) {
    let o = h.object;
    if (o.userData.panel) { const b = o.userData.panel.hitAt(h.uv); if (b) return { panel: o.userData.panel, button: b.id, point: h.point }; continue; }
    while (o && !o.userData.pickable) o = o.parent;
    if (o && o.visible) return { object: o, point: h.point };
  }
  return null;
}
let hovered = null;
function setHover(hit) {
  const obj = hit?.object || null;
  if (hovered !== obj) {
    if (hovered) hovered.traverse(m => { if (m.isMesh && m.userData.baseEmissive) m.material.emissive.copy(m.userData.baseEmissive); });
    hovered = obj;
    if (hovered && !S.busy) hovered.traverse(m => { if (m.isMesh && m.material.emissive) m.material.emissive.set('#1E7C7B'); });
  }
  for (const p of panels) {
    const id = hit?.panel === p ? hit.button : null;
    if (p.hover !== id) { p.hover = id; p.draw(); }
  }
  renderer.domElement.style.cursor = (obj || hit?.button) ? 'pointer' : 'grab';
}
function setRayFromPointer(e) {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
}
let downAt = null;
renderer.domElement.addEventListener('pointermove', e => { if (renderer.xr.isPresenting) return; setRayFromPointer(e); setHover(pickFromRay()); });
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) { downAt = null; return; }
  downAt = null; setRayFromPointer(e); handlePick(pickFromRay(), true);
});
function handlePick(hit, byUser) {
  if (byUser && S.auto) setAuto(false);
  if (!hit) return;
  if (hit.panel) { if (hit.button) onButton(hit.button); return; }
  if (hit.object) onObject(hit.object);
}

// XR controllers: a ray line on each, trigger = select; the hint pill rides on the left wrist
const xrControllers = [];
const tmpMat = new THREE.Matrix4();
for (let k = 0; k < 2; k++) {
  const ctrl = renderer.xr.getController(k); rig.add(ctrl);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]), new THREE.LineBasicMaterial({ color: C.focus }));
  line.scale.z = 3; ctrl.add(line);
  const grip = renderer.xr.getControllerGrip(k); rig.add(grip);
  const body = new THREE.Mesh(new RoundedBoxGeometry(0.04, 0.03, 0.12, 2, 0.01), new THREE.MeshStandardMaterial({ color: '#1E293B' })); grip.add(body);
  ctrl.addEventListener('selectstart', () => {
    tmpMat.identity().extractRotation(ctrl.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tmpMat);
    handlePick(pickFromRay(), true);
  });
  ctrl.addEventListener('connected', e => { ctrl.userData.gamepad = e.data.gamepad; if (e.data.handedness === 'left') { grip.add(hint.mesh); hint.mesh.visible = true; hint.mesh.position.set(0, 0.07, 0.02); hint.mesh.rotation.set(-1.0, 0, 0); hint.mesh.scale.setScalar(0.5); } });
  ctrl.addEventListener('disconnected', () => { if (hint.mesh.parent === grip) { taskGroup.add(hint.mesh); hint.mesh.visible = false; hint.mesh.rotation.set(0, 0, 0); hint.mesh.scale.setScalar(1); drawTask(); } });
  xrControllers.push({ ctrl, line, grip });
}
function pulseHaptics(n) {
  const session = renderer.xr.getSession?.(); if (!session) return;
  for (const src of session.inputSources) { const a = src.gamepad?.hapticActuators?.[0]; try { a?.pulse?.(0.6, n > 1 ? 60 : 40); } catch (_) {} }
}
// In VR the camera lives inside the rig, so moving the rig moves the player.
renderer.xr.addEventListener('sessionstart', () => {
  rig.add(camera); camera.position.set(0, 0, 0);
  if (S.flow === 1) { rig.position.set(GOWN_CAM.x, 0, GOWN_CAM.z); rig.rotation.y = Math.PI / 2; } // face the bench
  else { rig.rotation.y = 0; rig.position.set(0, 0, S.i === 0 && !S.finished ? START_CAM.z : VR_STAND_Z); }
  placeTask(true);
});
renderer.xr.addEventListener('sessionend', () => {
  scene.add(camera); rig.position.set(0, 0, 0); rig.rotation.y = 0;
  if (S.flow === 1) { camera.position.copy(GOWN_CAM); controls.target.copy(GOWN_LOOK); }
  else { camera.position.copy(S.i === 0 ? START_CAM : STAND_CAM); controls.target.copy(S.i === 0 ? START_LOOK : STAND_LOOK); }
  controls.update();
});

// ------------------------------------------------------------------ voice + HUD
function speak(text) {
  try { if (!('speechSynthesis' in window) || !text) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1.02; speechSynthesis.speak(u); } catch (_) {}
}
const btnAuto = document.getElementById('btn-auto'), btnAssess = document.getElementById('btn-assess');
const btnFlow1 = document.getElementById('btn-flow1'), btnFlow3 = document.getElementById('btn-flow3');
function syncHud() {
  btnAuto.setAttribute('aria-pressed', String(S.auto)); btnAssess.setAttribute('aria-pressed', String(S.assess));
  btnFlow1.setAttribute('aria-pressed', String(S.flow === 1)); btnFlow3.setAttribute('aria-pressed', String(S.flow === 3));
  // collapsed card still says where the trainee is
  const sub = document.getElementById('hud-sub');
  if (sub) sub.textContent = S.flow === 1 ? 'Flow 1 · Gowning' : S.finished ? 'Flow 3 · Complete' : `Flow 3 · Step ${row().n} of 13`;
}
btnFlow1.addEventListener('click', () => { setAuto(false); startGown(); });
btnFlow3.addEventListener('click', () => { setAuto(false); restart(); });
function setAuto(on) { S.auto = on; autoT = 0; drawHelp(); syncHud(); }
function setAssess(on) { S.assess = on; if (S.mode === 'nudge' || S.mode === 'demo') S.mode = 'task'; cueTone = 'task'; setCues(); redrawAll(); }
btnAuto.addEventListener('click', () => setAuto(!S.auto));
btnAssess.addEventListener('click', () => setAssess(!S.assess));
document.getElementById('btn-restart').addEventListener('click', () => { setAuto(false); startGown(); });
if ('xr' in navigator) {
  navigator.xr.isSessionSupported('immersive-vr').then(ok => { if (ok) document.getElementById('vr-slot').appendChild(VRButton.createButton(renderer)); }).catch(() => {});
}

// auto-play: walks the whole flow, showing one error on each step that has one
let autoT = 0;
function autoStep() {
  if (S.busy) return;
  if (S.finished) { restart(); return; }
  const r = row();
  if (S.mode === 'progress') return;
  if (S.mode === 'error' || S.mode === 'nudge' || S.mode === 'demo') { retry(); return; }
  if (S.i === 0 && !S.demoErr) { S.demoErr = true; nudge(); return; }
  if (r.e && !S.demoErr && r.c !== 'WaitForMachine') {
    S.demoErr = true;
    if (r.c === 'PickItem') onObject(packets[1]); else error(r.e, r.ed);
    return;
  }
  const o = targetsFor(r.t)[0]; if (o) onObject(o);
}

// ------------------------------------------------------------------ loop
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  stepTweens(dt);
  if (!renderer.xr.isPresenting) controls.update();
  if (S.mode === 'progress' && S.prog) {
    S.prog.t += dt; S.prog.p = Math.min(1, S.prog.t / S.prog.dur); drawTask();
    if (S.prog.p >= 1) { const done = S.prog.onDone; S.prog = null; S.mode = 'task'; done(); }
  }
  if (S.toastUntil && !toastVisible()) { S.toastUntil = 0; drawToast(); drawTask(); }
  if (S.flow === 3 && !S.auto && !S.assess && S.mode === 'task' && !S.busy && !S.finished) { idleTimer += dt; if (idleTimer > IDLE_SECONDS) { idleTimer = 0; nudge(); } }
  if (S.auto) { autoT += dt; if (autoT > 2.2) { autoT = 0; if (S.flow === 1) autoGown(); else autoStep(); } }
  if (S.flow === 1) {
    if (G.state === 'loading') { G.loadT += dt; drawTask(); if (G.loadT >= 2.5) { G.state = 'done'; enterCleanroom(); } }
    if (G.cur && G.state === 'detail') G.cur.rotation.y += dt * 0.8;
  }
  for (const it of gownItems) {
    const l = it.userData.label; if (!l) continue;
    l.visible = S.flow === 1 && it.visible && it !== G.cur && G.state !== 'loading';
    if (l.visible) l.position.copy(it.userData.home).add(new THREE.Vector3(0, 0.15, 0));
  }
  // lazy-follow task panel
  placeTask(false);
  taskGroup.position.lerp(panelGoal, 1 - Math.pow(0.02, dt));
  faceViewer(taskGroup);
  updateCues(t);
  zoneRing.material.opacity = 0.55 + 0.3 * Math.sin(t * 3);
  // XR hover: first controller's ray
  if (renderer.xr.isPresenting && xrControllers[0]) {
    const c0 = xrControllers[xrControllers.length - 1].ctrl;
    tmpMat.identity().extractRotation(c0.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(c0.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tmpMat);
    setHover(pickFromRay());
  }
  renderer.render(scene, camera);
});

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// debugging hook (handy in the browser console)
window.__f3 = { renderer, scene, camera, controls, S, G, restart, startGown, onObject, onButton, targetsFor, row, packets, gownItems, GOWN, setAssess, setAuto };

// fonts first, so the canvas panels use Poppins
Promise.race([Promise.all(['400 20px Poppins', '500 18px Poppins', '600 26px Poppins', '700 30px Poppins'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))])
  .finally(() => { document.getElementById('loading').hidden = true; startGown(); });
</script>
